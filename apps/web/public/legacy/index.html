<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Live News Stream</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Bangers&family=Cinzel:wght@400;600;700;800&family=IBM+Plex+Sans:wght@400;600;700;800&family=Manrope:wght@400;600;700;800&family=Orbitron:wght@400;600;700;800&family=Sora:wght@400;600;700;800&family=Space+Grotesk:wght@400;600;700;800&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <div class="topbar">
      <div class="topbarInner" id="topbarInner">
        <div class="headerRow">
          <div class="headerLeft">
            <h1 id="appTitle">Live News Stream</h1>
            <div class="subHint" id="subHint">Drag columns · <b>?</b> Help · <b>M</b> Menu · <b>/</b> Search</div>
          </div>
          <div class="headerRight">
            <div id="status" class="statusPill">Connecting...</div>
            <div id="tokenUsage" class="statusPill">Tokens: 0</div>
            <label class="checkbox topQuickLabel" title="Quick vibe switch">
              <span id="quickVibeLabelText">Vibe:</span>
              <select id="quickVibeSelect" class="select topQuickSelect">
                <option value="default" selected>Default</option>
                <option value="anime">Anime Pop</option>
                <option value="arcade">Video Game</option>
                <option value="cinema">Movie Night</option>
                <option value="newspaper">Newspaper</option>
                <option value="cyberwitch">Cyber Witch</option>
                <option value="fantasy">Fantasy</option>
                <option value="scifi">Sci-Fi</option>
              </select>
            </label>
            <button id="quickSearchBtn" class="btn ghost" type="button">Search</button>
            <button id="quickAddStreamBtn" class="btn ghost" type="button">Add Stream</button>
            <button id="controlsToggle" class="btn ghost" type="button">Hide top controls</button>
            <button id="allColControlsToggle" class="btn ghost" type="button">Hide all column controls</button>
            <button id="hideAllResearchBtn" class="btn ghost" type="button">Hide all research</button>
            <button id="menuToggle" class="btn ghost" type="button">Hide menu</button>
          </div>
        </div>

        <div class="controls">
          <div class="controlsCompactRow controlsRow">
            <div class="controlGroup">
              <button id="resetBtn" class="btn" type="button">Reset ALL to newest 10</button>
              <label class="checkbox" title="Delete old news by age from all columns">
                <span id="deleteAgePrefix">Delete age:</span>
                <select id="deleteAgeSelect" class="select">
                  <option value="yesterday">Yesterday</option>
                  <option value="week" selected>Past week</option>
                  <option value="month">Past month</option>
                  <option value="year">Past year</option>
                </select>
              </label>
              <button id="deleteAgeAllBtn" class="btn danger" type="button">Delete old (all columns)</button>
              <label class="checkbox" title="Embeddings matching, AI dedupe, summaries, research">
                <input id="aiEnabled" type="checkbox" />
                <span id="aiEnabledLabel">AI Enabled</span>
              </label>
              <button id="helpBtn" class="btn" type="button">Help</button>
            </div>
          </div>
          <div class="controlsHint" id="controlsHint">Click section headers below to expand/collapse settings.</div>

          <div class="controlsGrid">
            <details class="controlSection" open>
              <summary id="notificationsSummary">Notifications</summary>
              <div class="controlGroup">
                <label class="checkbox">
                  <input id="notifyEnabled" type="checkbox" />
                  <span id="notifyEnabledLabel">Enable notifications</span>
                </label>
                <label class="checkbox">
                  <span id="notifyPrefix">Notify:</span>
                  <select id="notifyMode" class="select">
                    <option value="matched" selected>Only matched</option>
                    <option value="matched_pinned">Matched + pinned columns</option>
                    <option value="pinned">Only pinned columns</option>
                    <option value="all">All columns</option>
                  </select>
                </label>
              </div>
            </details>

            <details class="controlSection" open>
              <summary id="aiSettingsSummary">AI Settings</summary>
              <div class="controlGroup">
                <label class="checkbox">
                  <span id="summaryLangPrefix">Summary:</span>
                  <select id="summaryLang" class="select">
                    <option value="bilingual">BG / EN</option>
                    <option value="bg">BG</option>
                    <option value="en">EN</option>
                  </select>
                </label>
                <label class="checkbox">
                  <span id="researchLangPrefix">Research:</span>
                  <select id="researchLang" class="select">
                    <option value="bg" selected>BG</option>
                    <option value="en">EN</option>
                  </select>
                </label>
                <label class="checkbox" title="Apply one budget to all columns">
                  <span id="allBudgetPrefix">AI Budget (all):</span>
                  <select id="allBudgetSelect" class="select">
                    <option value="mixed">Mixed</option>
                    <option value="low">Low</option>
                    <option value="standard" selected>Standard</option>
                    <option value="high">High</option>
                  </select>
                </label>
              </div>
            </details>

            <details class="controlSection" open>
              <summary id="appearanceSummary">Appearance</summary>
              <div class="controlGroup" id="appearanceGroup">
                <label class="checkbox" title="Change UI font">
                  <span id="fontPrefix">Font:</span>
                  <select id="fontSelect" class="select">
                    <option value="system" selected>System</option>
                    <option value="manrope">Manrope</option>
                    <option value="grotesk">Space Grotesk</option>
                    <option value="sora">Sora</option>
                    <option value="plex">IBM Plex Sans</option>
                    <option value="serif">Serif</option>
                    <option value="mono">Mono</option>
                  </select>
                </label>
                <label class="checkbox" title="Scale text size">
                  <span id="fontSizePrefix">Font size:</span>
                  <select id="fontSizeSelect" class="select">
                    <option value="sm">Small</option>
                    <option value="md" selected>Medium</option>
                    <option value="lg">Large</option>
                    <option value="xl">Extra Large</option>
                  </select>
                </label>
                <label class="checkbox" title="Column accent scheme">
                  <span id="schemePrefix">Scheme:</span>
                  <select id="schemeSelect" class="select">
                    <option value="classic" selected>Classic</option>
                    <option value="vivid">Vivid</option>
                    <option value="sunset">Sunset</option>
                    <option value="neon">Neon</option>
                    <option value="ocean">Ocean</option>
                    <option value="forest">Forest</option>
                  </select>
                </label>
                <label class="checkbox" title="Item buttons look">
                  <span id="buttonsPrefix">Buttons:</span>
                  <select id="btnModeSelect" class="select">
                    <option value="icons" selected>Icons</option>
                    <option value="text">Text</option>
                  </select>
                </label>

                <label class="checkbox" title="Visual vibe preset">
                  <span id="vibePrefix">Vibe:</span>
                  <select id="vibeSelect" class="select">
                    <option value="default" selected>Default</option>
                    <option value="anime">Anime Pop</option>
                    <option value="arcade">Video Game</option>
                    <option value="cinema">Movie Night</option>
                    <option value="newspaper">Newspaper</option>
                    <option value="cyberwitch">Cyber Witch</option>
                    <option value="fantasy">Fantasy</option>
                    <option value="scifi">Sci-Fi</option>
                  </select>
                </label>

                <label class="checkbox" title="Interface language">
                  <span id="interfaceLangPrefix">Interface:</span>
                  <select id="interfaceLang" class="select">
                    <option value="en" selected>EN</option>
                    <option value="bg">BG</option>
                  </select>
                </label>
              </div>
            </details>
          </div>

          <details id="searchSection" class="controlSection controlSectionWide" open>
            <summary id="searchSummary">Search</summary>
            <div class="searchRow">
              <input
                id="searchInput"
                class="input"
                placeholder="Search (title + summary + research)..."
              />
              <button id="clearSearchBtn" class="btn" type="button">Clear</button>
            </div>
            <div id="searchInfo"></div>
          </details>

          <details id="addStreamSection" class="controlSection controlSectionWide">
            <summary id="addStreamSummary">Add Stream</summary>
            <div class="addRow addRow4">
              <select id="feedType" class="select">
                <option value="rss" selected>RSS</option>
                <option value="reddit">Reddit (subreddit)</option>
                <option value="youtube">YouTube (channel)</option>
              </select>

              <input id="feedUrl" class="input" placeholder="Paste RSS URL OR subreddit OR YouTube channel URL..." />
              <input id="feedLabel" class="input" placeholder="Optional label" />

              <select id="feedInterval" class="select" title="Polling interval">
                <option value="45">45s</option>
                <option value="60">60s</option>
                <option value="90">90s</option>
                <option value="120" selected>120s</option>
                <option value="180">180s</option>
                <option value="300">300s</option>
              </select>

              <button id="addFeedBtn" class="btn" type="button">Add Stream</button>
            </div>
            <div id="addFeedStatus"></div>
          </details>
        </div>
      </div>
    </div>

    <div class="container">
      <div id="grid"></div>
    </div>

    <div id="helpOverlay" role="dialog" aria-modal="true">
      <div id="helpModal">
        <div id="helpTopRow">
          <h2 id="helpTitle" style="margin:0;font-size:14px;letter-spacing:0.2px;">Help</h2>
          <button id="helpClose" class="btn" type="button">Close</button>
        </div>
        <ul id="helpList" class="helpList"></ul>
      </div>
    </div>

    <div id="toast" aria-live="polite"></div>

    <script src="app.js"></script>
  </body>
</html>
